<!doctype html>
<html
  lang="en"
  data-theme="animorank-dark"
>
  <head>
    <meta charset="utf-8" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/brand/favicon/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="%sveltekit.assets%/brand/favicon/favicon-96x96.png"
    />
    <link
      rel="shortcut icon"
      href="%sveltekit.assets%/brand/favicon/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/brand/favicon/apple-touch-icon.png"
    />
    <link
      rel="manifest"
      href="%sveltekit.assets%/brand/favicon/site.webmanifest"
    />
    <meta
      name="theme-color"
      content="#141414"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Apply the saved light/dark theme before first paint to avoid a flash.
         Mirrors $lib/theme.svelte.ts; keep the storage key and values in sync. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.setAttribute('data-theme', 'animorank-' + t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#d4dde4' : '#141414');
        } catch (e) {}
      })();
    </script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
